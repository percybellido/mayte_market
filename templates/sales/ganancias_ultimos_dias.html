{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h3 class="mb-4 text-center">Utilidad de los últimos 7 días</h3>
  <table class="table table-bordered table-striped text-center">
    <thead class="table-dark">
      <tr>
        <th>Fecha</th>
        <th>Ganancia (S/)</th>
      </tr>
    </thead>
    <tbody>
      {% for item in ganancias %}
      <tr>
        <td>{{ item.fecha|date:"d/m/Y" }}</td>
        <td>{{ item.ganancia|floatformat:2 }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2">No hay registros de ventas recientes.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
